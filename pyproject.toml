[project]
name = "roadlens"
version = "0.1.0"
description = "AI framework for road condition assessment and management"
readme = "README.md"
authors = [
    { name = "Dinuka Perera", email = "dinukadilshan1105@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5",
    "python-dotenv>=1,<2",
    "pyyaml>=6.0.3",
    "ultralytics>=8.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "nbdime>=4.0.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
